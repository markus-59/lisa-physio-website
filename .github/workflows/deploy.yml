# Builds the Astro site and publishes it to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Every page is encrypted with this password (see build:locked in package.json).
    # Set it once with: gh secret set SITE_PASSWORD
    env:
      STATICRYPT_PASSWORD: ${{ secrets.SITE_PASSWORD }}
    steps:
      - name: Check the site password is set
        run: |
          if [ -z "$STATICRYPT_PASSWORD" ]; then
            echo "::error::The SITE_PASSWORD secret is missing, so the site can't be locked."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        with:
          build-cmd: npm run build:locked

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
