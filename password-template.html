<!doctype html>
<!--
  The password page StatiCrypt wraps every built page in (see the build:locked script in package.json).
  It sits outside src/ because it's plain HTML, not an Astro page: the /*[|…|]*/ markers are filled in by StatiCrypt.
  Colours and type follow src/styles/global.css.
-->
<html lang="en-GB" class="staticrypt-html">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>The Mental Marathon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300..600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --mist: #f4f3fa;
        --ink: #2a2540;
        --muted: #6e6888;
        --line: #e4dff1;
        --field: #cfc7e3;
        --lavender: #ece6f8;
        --blush: #f6e9f2;
        --violet: #5b3e96;
        --violet-deep: #3b2766;
        --peach: #ffe6d9;
        --peach-ink: #7a3a1d;
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--mist);
        color: var(--ink);
        font-family: Lexend, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background:
          radial-gradient(60rem 30rem at 0% 0%, var(--lavender), transparent 70%),
          radial-gradient(40rem 30rem at 100% 100%, var(--blush), transparent 70%),
          var(--mist);
      }

      .hidden {
        display: none !important;
      }

      :focus-visible {
        outline: 2px solid var(--violet);
        outline-offset: 2px;
      }

      .card {
        width: 100%;
        max-width: 26rem;
        padding: 32px 24px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 28px;
        box-shadow:
          0 1px 2px rgb(42 37 64 / 0.04),
          0 16px 40px -16px rgb(59 39 102 / 0.22);
      }

      @media (min-width: 480px) {
        .card {
          padding: 40px 36px;
        }
      }

      .ring {
        display: block;
        width: 64px;
        height: 64px;
        margin-bottom: 24px;
      }

      h1 {
        margin: 0;
        font-size: 1.75rem;
        line-height: 1.15;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: var(--violet-deep);
        text-wrap: balance;
      }

      .subtitle {
        margin: 8px 0 0;
        font-weight: 300;
        line-height: 1.5;
        color: var(--muted);
      }

      form {
        margin-top: 24px;
        padding-top: 24px;
        border-top: 1px solid var(--line);
      }

      .field-label {
        display: block;
        font-weight: 500;
      }

      .hint {
        margin: 4px 0 0;
        font-size: 0.9rem;
        font-weight: 300;
        line-height: 1.45;
        color: var(--muted);
      }

      .password {
        position: relative;
        margin-top: 12px;
      }

      .password input {
        width: 100%;
        padding: 12px 84px 12px 16px;
        font: inherit;
        font-size: 1rem;
        color: var(--ink);
        background: var(--mist);
        border: 1px solid var(--field);
        border-radius: 14px;
      }

      .password input[aria-invalid="true"] {
        border-color: #a3502a;
      }

      .toggle {
        position: absolute;
        top: 50%;
        right: 6px;
        transform: translateY(-50%);
        padding: 8px 12px;
        font: inherit;
        font-size: 0.875rem;
        font-weight: 500;
        color: var(--violet);
        background: transparent;
        border: 0;
        border-radius: 10px;
        cursor: pointer;
      }

      .toggle:hover {
        background: var(--lavender);
      }

      .error {
        margin: 12px 0 0;
        padding: 10px 14px;
        font-size: 0.9rem;
        line-height: 1.45;
        color: var(--peach-ink);
        background: var(--peach);
        border-radius: 12px;
      }

      .error:empty {
        display: none;
      }

      .remember {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        margin-top: 16px;
        font-size: 0.9rem;
        line-height: 1.45;
        color: var(--muted);
        cursor: pointer;
      }

      .remember input {
        flex-shrink: 0;
        width: 18px;
        height: 18px;
        margin: 1px 0 0;
        accent-color: var(--violet);
      }

      .submit {
        width: 100%;
        margin-top: 24px;
        padding: 14px 20px;
        font: inherit;
        font-weight: 500;
        color: #fff;
        background: var(--violet);
        border: 0;
        border-radius: 999px;
        cursor: pointer;
        transition: background-color 150ms;
      }

      .submit:hover {
        background: var(--violet-deep);
      }

      .submit:disabled {
        opacity: 0.75;
        cursor: progress;
      }

      .loading .ring {
        margin: 0;
      }

      @media (prefers-reduced-motion: no-preference) {
        .loading .ring {
          animation: spin 1.6s linear infinite;
        }
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body class="staticrypt-body">
    <!-- The course ring from the site: one segment per module, in each module's colour. -->
    <template id="ring">
      <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="42" fill="none" stroke="#5B3E96" stroke-width="10" stroke-linecap="round"
          stroke-dasharray="69.96 263.89" transform="rotate(-77.72 50 50)" />
        <circle cx="50" cy="50" r="42" fill="none" stroke="#1F6B52" stroke-width="10" stroke-linecap="round"
          stroke-dasharray="69.96 263.89" transform="rotate(42.28 50 50)" />
        <circle cx="50" cy="50" r="42" fill="none" stroke="#A3502A" stroke-width="10" stroke-linecap="round"
          stroke-dasharray="69.96 263.89" transform="rotate(162.28 50 50)" />
      </svg>
    </template>

    <div id="staticrypt_loading" class="loading" role="status" aria-label="Opening the course"></div>

    <main id="staticrypt_content" class="card hidden">
      <div class="ring-slot"></div>
      <h1>The Mental Marathon</h1>
      <p class="subtitle">Inside the psychology of complex orthopaedic recovery</p>

      <form id="staticrypt-form" action="#" method="post">
        <label class="field-label" for="staticrypt-password">Password</label>
        <p class="hint" id="password-hint">This course is private. Enter the password you were given.</p>

        <div class="password">
          <input
            id="staticrypt-password"
            type="password"
            name="password"
            autocomplete="current-password"
            autocapitalize="off"
            spellcheck="false"
            required
            aria-describedby="password-hint password-error"
          />
          <button type="button" class="toggle" id="toggle-password" aria-pressed="false" aria-controls="staticrypt-password">Show</button>
        </div>

        <p class="error" id="password-error" role="alert"></p>

        <label id="staticrypt-remember-label" class="remember hidden">
          <input id="staticrypt-remember" type="checkbox" name="remember" checked />
          Remember me on this device for 30 days
        </label>

        <button type="submit" class="submit">Open the course</button>
      </form>
    </main>

    <script>
      // these variables will be filled when generating the file - the template format is '/*[|variable_name|]*/0'
      const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
      const isRememberEnabled = /*[|is_remember_enabled|]*/ 0,
        staticryptConfig = /*[|staticrypt_config|]*/ 0;

      const templateConfig = {
        rememberExpirationKey: "staticrypt_expiration",
        rememberPassphraseKey: "staticrypt_passphrase",
        replaceHtmlCallback: null,
        clearLocalStorageCallback: null,
      };

      const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

      const ring = document.getElementById("ring").content;
      document.getElementById("staticrypt_loading").append(ring.cloneNode(true));
      document.querySelector(".ring-slot").replaceWith(ring.cloneNode(true));

      const form = document.getElementById("staticrypt-form");
      const passwordInput = document.getElementById("staticrypt-password");
      const toggle = document.getElementById("toggle-password");
      const error = document.getElementById("password-error");
      const submit = form.querySelector(".submit");

      // A saved password from "Remember me" opens the page straight away; otherwise show the form.
      window.onload = async function () {
        const { isSuccessful } = await staticrypt.handleDecryptOnLoad();
        if (isSuccessful) return;

        document.getElementById("staticrypt_loading").classList.add("hidden");
        document.getElementById("staticrypt_content").classList.remove("hidden");
        if (isRememberEnabled) document.getElementById("staticrypt-remember-label").classList.remove("hidden");
        passwordInput.focus();
      };

      toggle.addEventListener("click", function () {
        const show = passwordInput.type === "password";
        passwordInput.type = show ? "text" : "password";
        toggle.textContent = show ? "Hide" : "Show";
        toggle.setAttribute("aria-pressed", String(show));
      });

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        error.textContent = "";
        submit.disabled = true;
        submit.textContent = "Opening…";

        const remember = document.getElementById("staticrypt-remember").checked;
        const { isSuccessful } = await staticrypt.handleDecryptionOfPage(passwordInput.value, remember);
        if (isSuccessful) return;

        submit.disabled = false;
        submit.textContent = "Open the course";
        passwordInput.setAttribute("aria-invalid", "true");
        error.textContent = "That password doesn't match. Check for typos and try again.";
        passwordInput.select();
      });
    </script>
  </body>
</html>
